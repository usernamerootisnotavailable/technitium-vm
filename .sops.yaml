---
# SOPS creation rules.
#
# This repository intentionally ships without age recipients. Add one rule per
# environment after generating or receiving the environment's public age key.
# Never add a private key to this file.
#
# Example:
#
# creation_rules:
#   - path_regex: inventories/dev/.*\.sops\.ya?ml$
#     age: age1...
#   - path_regex: inventories/prod/.*\.sops\.ya?ml$
#     age: age1...
#
# The first matching rule wins. Paths are relative to this file.
creation_rules: []
