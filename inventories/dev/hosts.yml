---
all:
  children:
    dns:
      hosts:
        dns01:
          ansible_host: 127.0.0.1
          ansible_port: 2222
          ansible_user: ansible
          ansible_ssh_private_key_file: .dev/ssh/id_ed25519
          ansible_ssh_common_args: >-
            -o UserKnownHostsFile=.dev/known_hosts
            -o StrictHostKeyChecking=yes
            -o IdentitiesOnly=yes
