---
# Test-only app configuration. This playbook is never imported by site.yml and
# is not a supported production management path. It creates a temporary DHCP
# scope through the Technitium API solely to prove broadcast and lease handling.
- name: Prove DHCP with a temporary scope and veth client
  hosts: dns
  become: true
  gather_facts: true
  vars:
    technitium_test_api_url: "http://127.0.0.1"
    technitium_test_api_port: 5380
    technitium_test_scope: ci-dhcp
    technitium_test_server: 10.53.0.1
    technitium_test_netns: ci-dhcp-client
    technitium_test_veth_host: ci-veth-dns
    technitium_test_veth_client: ci-veth-client
  tasks:
    - name: Log in to the test Technitium API
      ansible.builtin.uri:
        url: "{{ technitium_test_api_url }}:{{ technitium_test_api_port }}/api/user/login"
        method: POST
        body_format: form-urlencoded
        body:
          user: admin
          pass: "{{ technitium_admin_password }}"
          includeInfo: "false"
        status_code: 200
        return_content: true
      register: technitium_test_login
      no_log: true

    - name: Run the DHCP proof
      block:
        - name: Create the test veth and namespace
          ansible.builtin.include_tasks: tasks/create-test-network.yml

        - name: Create and enable the temporary DHCP scope
          ansible.builtin.uri:
            url: "{{ technitium_test_api_url }}:{{ technitium_test_api_port }}/api/dhcp/scopes/set"
            method: POST
            headers:
              Authorization: "Bearer {{ technitium_test_login.json.token }}"
            body_format: form-urlencoded
            body:
              name: "{{ technitium_test_scope }}"
              startingAddress: 10.53.0.100
              endingAddress: 10.53.0.200
              subnetMask: 255.255.255.0
              routerAddress: "{{ technitium_test_server }}"
              useThisDnsServer: "true"
              dnsUpdates: "false"
              leaseTimeDays: "0"
              leaseTimeHours: "1"
              leaseTimeMinutes: "0"
            status_code: 200
            return_content: false
          register: technitium_test_scope_set
          no_log: true

        - name: Record that the temporary scope exists
          ansible.builtin.set_fact:
            technitium_test_scope_created: true

        - name: Allow the scope to bind its test interface
          ansible.builtin.pause:
            seconds: 3

        - name: Request a lease
          ansible.builtin.command:
            argv:
              - ip
              - netns
              - exec
              - "{{ technitium_test_netns }}"
              - dhcpcd
              - -4
              - -1
              - -t
              - "20"
              - -C
              - resolv.conf
              - -h
              - dhcp-test
              - "{{ technitium_test_veth_client }}"
          changed_when: true

        - name: Read the leased address
          ansible.builtin.command:
            argv:
              - ip
              - netns
              - exec
              - "{{ technitium_test_netns }}"
              - ip
              - -4
              - -o
              - addr
              - show
              - dev
              - "{{ technitium_test_veth_client }}"
          register: technitium_test_addr
          changed_when: false
          check_mode: false

        - name: Extract the leased address
          ansible.builtin.set_fact:
            technitium_test_lease: >-
              {{ technitium_test_addr.stdout
                 | regex_search('inet ([0-9.]+)/', '\\1') | first | default('') }}

        - name: Assert a lease was allocated from the test pool
          ansible.builtin.assert:
            that:
              - technitium_test_lease is search('^10\\.53\\.0\\.')
            fail_msg: DHCP did not allocate an address from the temporary scope.
            quiet: true

      always:
        - name: Remove the temporary DHCP scope
          ansible.builtin.uri:
            url: "{{ technitium_test_api_url }}:{{ technitium_test_api_port }}/api/dhcp/scopes/delete"
            method: POST
            headers:
              Authorization: "Bearer {{ technitium_test_login.json.token }}"
            body_format: form-urlencoded
            body:
              name: "{{ technitium_test_scope }}"
            status_code: 200
            return_content: false
          when: technitium_test_scope_created | default(false)
          no_log: true

        - name: Read the test veth state for cleanup
          ansible.builtin.stat:
            path: "/sys/class/net/{{ technitium_test_veth_host }}"
          register: technitium_test_cleanup_veth

        - name: Remove the test veth pair
          ansible.builtin.command:
            argv:
              - ip
              - link
              - delete
              - "{{ technitium_test_veth_host }}"
          when: technitium_test_cleanup_veth.stat.exists
          changed_when: true

        - name: Read the test namespace state for cleanup
          ansible.builtin.stat:
            path: "/var/run/netns/{{ technitium_test_netns }}"
          register: technitium_test_cleanup_netns

        - name: Remove the test network namespace
          ansible.builtin.command:
            argv:
              - ip
              - netns
              - delete
              - "{{ technitium_test_netns }}"
          when: technitium_test_cleanup_netns.stat.exists
          changed_when: true
