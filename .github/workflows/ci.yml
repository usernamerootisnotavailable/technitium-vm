---
name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  ANSIBLE_CONFIG: ${{ github.workspace }}/ansible.cfg
  ANSIBLE_COLLECTIONS_PATH: ${{ github.workspace }}/collections

jobs:
  lint:
    name: Lint, policy, and syntax
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install Python dependencies
        run: pip install -r requirements-dev.txt
      - name: Install Ansible collections
        run: ansible-galaxy collection install -r requirements.yml -p ./collections
      - name: Lint YAML
        run: yamllint .
      - name: Lint Ansible
        run: ansible-lint
      - name: Lint shell scripts
        run: shellcheck scripts/*.sh docker/dev/entrypoint.sh
      - name: Check policy
        run: ./scripts/check-policy.sh
      - name: Syntax-check playbooks
        run: |
          for playbook in site.yml playbooks/*.yml playbooks/tests/*.yml; do
            ansible-playbook -i inventories/dev/hosts.yml "${playbook}" --syntax-check
          done
      - name: Publish lint success
        if: success()
        run: echo "::notice title=Lint and policy::lint, policy, shellcheck, and syntax passed."

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out full history
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
        run: |
          set -euo pipefail
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl -fsSLO "${base}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLO "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep 'linux_x64.tar.gz' "gitleaks_${GITLEAKS_VERSION}_checksums.txt" | sha256sum -c -
          tar -xzf "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" gitleaks
          chmod 0755 gitleaks
      - name: Scan history
        run: ./gitleaks git --redact --verbose

  molecule:
    name: Molecule (${{ matrix.role }})
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        role:
          - common
          - podman
          - technitium
          - nginx
    steps:
      - name: Check out the repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install Python dependencies
        run: pip install -r requirements-dev.txt
      - name: Install Ansible collections
        run: ansible-galaxy collection install -r requirements.yml -p ./collections
      - name: Build the AlmaLinux 10 test image
        run: docker build -t technitium-host/almalinux10-ansible:10 docker/dev
      - name: Run the Molecule scenario
        working-directory: roles/${{ matrix.role }}
        run: |
          set -o pipefail
          molecule test 2>&1 | tee "${RUNNER_TEMP}/molecule-${{ matrix.role }}.log"
      - name: Publish Molecule success
        if: success()
        run: echo "::notice title=Molecule (${{ matrix.role }})::Scenario passed."
      - name: Collect Molecule diagnostics
        if: failure()
        working-directory: roles/${{ matrix.role }}
        run: |
          log="${RUNNER_TEMP}/molecule-${{ matrix.role }}.log"
          molecule list || true
          docker ps -a
          for container in $(docker ps -aq --filter label=owner=molecule); do
            echo "::group::docker logs ${container}"
            docker logs "${container}" || true
            echo "::endgroup::"
          done
          if [[ -f "${log}" ]]; then
            {
              echo "## Molecule (${{ matrix.role }}) failure"
              echo '```text'
              tail -n 120 "${log}"
              echo '```'
            } >> "${GITHUB_STEP_SUMMARY}"
            message="$(sed -e 's/\x1B\[[0-9;]*[mK]//g' -e 's/%/%25/g' "${log}" \
              | tr -d '\r' | tail -n 60 | tr '\n' ' ' | cut -c1-5000)"
            echo "::error title=Molecule (${{ matrix.role }}) failure::${message}"
          fi

  integration:
    name: Full-stack integration
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 75
    steps:
      - name: Check out the repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install Python dependencies
        run: pip install -r requirements-dev.txt
      - name: Install Ansible collections
        run: ansible-galaxy collection install -r requirements.yml -p ./collections
      - name: Run the integration test
        run: |
          set -o pipefail
          ./scripts/integration-test.sh 2>&1 | tee "${RUNNER_TEMP}/integration.log"
      - name: Publish integration success
        if: success()
        run: echo "::notice title=Integration::convergence, verify, DHCP proof, and idempotence passed."
      - name: Collect integration diagnostics
        if: failure()
        env:
          DEV_SSH_PUBKEY: /dev/null
        run: |
          log="${RUNNER_TEMP}/integration.log"
          docker compose -f docker/dev/compose.yml ps || true
          docker compose -f docker/dev/compose.yml logs || true
          docker compose -f docker/dev/compose.yml exec -T dns01-dev \
            sh -c 'journalctl --user-unit technitium.service --no-pager -n 100 2>/dev/null || true' || true
          docker compose -f docker/dev/compose.yml exec -T dns01-dev \
            sh -c 'tail -n 100 /var/log/nginx/error.log 2>/dev/null || true' || true
          docker ps -a
          if [[ -f "${log}" ]]; then
            {
              echo "## Integration failure"
              echo '```text'
              tail -n 120 "${log}"
              echo '```'
            } >> "${GITHUB_STEP_SUMMARY}"
            message="$(sed -e 's/\x1B\[[0-9;]*[mK]//g' -e 's/%/%25/g' "${log}" \
              | tr -d '\r' | tail -n 60 | tr '\n' ' ' | cut -c1-5000)"
            echo "::error title=Integration failure::${message}"
          fi
