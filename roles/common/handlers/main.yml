---
- name: Restart sshd
  ansible.builtin.systemd_service:
    name: "{{ common_ssh_service_name }}"
    state: restarted

- name: Restart chronyd
  ansible.builtin.systemd_service:
    name: chronyd
    state: restarted

- name: Restart systemd-journald
  ansible.builtin.systemd_service:
    name: systemd-journald
    state: restarted
