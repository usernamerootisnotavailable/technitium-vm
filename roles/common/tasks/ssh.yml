---
- name: Ensure the sshd drop-in directory exists
  ansible.builtin.file:
    path: /etc/ssh/sshd_config.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Ensure sshd includes drop-in configuration
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    line: "Include /etc/ssh/sshd_config.d/*.conf"
    insertbefore: BOF
    validate: /usr/sbin/sshd -t -f %s

- name: Configure SSH hardening
  ansible.builtin.template:
    src: sshd.conf.j2
    dest: "{{ common_ssh_config_file }}"
    owner: root
    group: root
    mode: "0644"
  notify: Restart sshd

- name: Validate the complete SSH configuration
  ansible.builtin.command:
    argv:
      - /usr/sbin/sshd
      - -t
      - -f
      - /etc/ssh/sshd_config
  changed_when: false
  check_mode: false

- name: Enable and start the SSH service
  ansible.builtin.systemd_service:
    name: "{{ common_ssh_service_name }}"
    enabled: true
    state: started
