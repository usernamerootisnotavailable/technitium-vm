---
# The secret is used only when Technitium creates its config for the first
# time. Existing data means the stored password already wins; password rotation
# is an explicit API operation documented in docs/OPERATIONS.md.
- name: Create the bootstrap admin secret
  containers.podman.podman_secret:
    name: "{{ technitium_admin_secret_name }}"
    data: "{{ technitium_admin_password }}"
    state: present
    skip_existing: true
  become: true
  become_user: "{{ technitium_service_user }}"
  environment:
    HOME: "{{ technitium_user_home }}"
    XDG_RUNTIME_DIR: "/run/user/{{ technitium_uid }}"
    XDG_CONFIG_HOME: "{{ technitium_user_home }}/.config"
  no_log: true
  notify: Reload and restart Technitium
