---
- name: Ensure firewalld is enabled and running
  ansible.builtin.systemd_service:
    name: firewalld
    enabled: true
    state: started

# The host is intentionally single-homed on the LAN. DNS and DHCP services are
# safe to add to the default zone only under that assumption.
- name: Allow DNS on the LAN zone
  ansible.posix.firewalld:
    service: dns
    zone: "{{ technitium_firewall_zone }}"
    permanent: true
    immediate: true
    state: enabled

- name: Allow DHCP on the LAN zone when requested
  ansible.posix.firewalld:
    service: dhcp
    zone: "{{ technitium_firewall_zone }}"
    permanent: true
    immediate: true
    state: enabled
  when: technitium_firewall_allow_dhcp | bool

- name: Keep DHCP closed when not requested
  ansible.posix.firewalld:
    service: dhcp
    zone: "{{ technitium_firewall_zone }}"
    permanent: true
    immediate: true
    state: disabled
  when: not (technitium_firewall_allow_dhcp | bool)
