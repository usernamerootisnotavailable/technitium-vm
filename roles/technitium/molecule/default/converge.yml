---
- name: Converge
  hosts: all
  become: true
  gather_facts: true
  vars:
    technitium_admin_password: >-
      {{ lookup('password', '/tmp/mol-technitium-admin length=32 chars=ascii_letters,digits') }}
    technitium_manage_firewall: false
    technitium_wait_retries: 120
    technitium_web_local_addresses:
      - 127.0.0.1
  roles:
    - role: common
    - role: podman
    - role: technitium
