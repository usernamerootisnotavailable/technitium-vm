---
- name: Converge
  hosts: all
  become: true
  gather_facts: true
  vars:
    technitium_version: "15.6.2"
    technitium_image_digest: "sha256:eb48ac5c135f4ab936b536f74f853d53e15ab39ef37fdbc9598a089b90d9f245"
    technitium_admin_password: >-
      {{ lookup('password', '/tmp/mol-technitium-admin length=32 chars=ascii_letters,digits') }}
    technitium_manage_firewall: false
    technitium_wait_retries: 120
    technitium_web_local_addresses:
      - 127.0.0.1
  roles:
    - role: common
    - role: podman
    - role: technitium
