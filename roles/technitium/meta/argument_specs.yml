---
argument_specs:
  main:
    short_description: Run Technitium DNS and DHCP in rootless Podman
    description:
      - Installs the pinned Technitium container with host networking.
      - Keeps the web console on loopback for the NGINX role.
      - Does not manage Technitium application settings; those are configured in the web UI.
      - The rootless low-port sysctl is required for DNS 53 and DHCP 67.
    options:
      technitium_image:
        type: str
        description: Container image repository.
      technitium_version:
        type: str
        description: Pinned Technitium image tag.
      technitium_image_digest:
        type: str
        required: true
        description: Pinned image digest.
      technitium_container_name:
        type: str
        description: Container and Quadlet unit name.
      technitium_service_user:
        type: str
        description: Unprivileged service account.
      technitium_service_group:
        type: str
        description: Service account group.
      technitium_user_home:
        type: str
        description: Service account home and Podman state root.
      technitium_config_dir:
        type: str
        description: Host directory mounted at /etc/dns.
      technitium_log_dir:
        type: str
        description: Host log root.
      technitium_log_subdir:
        type: str
        description: Host directory mounted at /var/log/technitium/dns.
      technitium_subuid_start:
        type: int
        description: First subordinate UID.
      technitium_subgid_start:
        type: int
        description: First subordinate GID.
      technitium_subid_count:
        type: int
        description: Number of subordinate IDs.
      technitium_rootless:
        type: bool
        description: Require rootless Podman.
      technitium_low_port_sysctl:
        type: bool
        description: Lower the unprivileged port floor for DNS and DHCP.
      technitium_unprivileged_port_start:
        type: int
        description: Port floor written to the host sysctl.
      technitium_sysctl_file:
        type: str
        description: Managed sysctl drop-in path.
      technitium_admin_password:
        type: str
        required: true
        description: Bootstrap admin password. Used only on first install.
      technitium_admin_secret_name:
        type: str
        description: Podman secret containing the bootstrap admin password.
      technitium_web_http_port:
        type: int
        description: Loopback HTTP console port.
      technitium_web_local_addresses:
        type: list
        elements: str
        description: Console listen addresses. Must remain loopback.
      technitium_api_url:
        type: str
        description: Loopback API base URL used for health checks.
      technitium_api_port:
        type: int
        description: API port.
      technitium_wait_retries:
        type: int
        description: API readiness retries.
      technitium_wait_delay:
        type: int
        description: API readiness delay in seconds.
      technitium_manage_firewall:
        type: bool
        description: Manage DNS and DHCP firewall services.
      technitium_firewall_zone:
        type: str
        description: LAN-bound firewalld zone.
      technitium_firewall_lan_cidrs:
        type: list
        elements: str
        description: LAN CIDRs used to validate the single-interface model.
      technitium_firewall_allow_dhcp:
        type: bool
        description: Open UDP 67 on the LAN zone.
      technitium_lan_interface:
        type: str
        description: Single LAN interface that carries the default route.
      technitium_server_address:
        type: str
        description: Static private server address on the LAN interface.
