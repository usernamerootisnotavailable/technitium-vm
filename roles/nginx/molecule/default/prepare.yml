---
- name: Prepare
  hosts: all
  become: true
  gather_facts: true
  tasks:
    - name: Verify the test platform
      ansible.builtin.assert:
        that:
          - ansible_distribution == "AlmaLinux"
          - ansible_distribution_major_version | int == 10
        fail_msg: This scenario only supports AlmaLinux 10.
        quiet: true
