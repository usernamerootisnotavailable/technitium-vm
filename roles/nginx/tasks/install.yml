---
- name: Install nginx and certificate support
  ansible.builtin.dnf:
    name:
      - nginx
      - python3-pip
    state: present

- name: Ensure the nginx configuration directory exists
  ansible.builtin.file:
    path: /etc/nginx/conf.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Remove package default virtual hosts
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/nginx/conf.d/default.conf
    - /etc/nginx/conf.d/ssl.conf
  loop_control:
    label: "{{ item }}"

- name: Install the nginx main configuration
  ansible.builtin.template:
    src: nginx.conf.j2
    dest: /etc/nginx/nginx.conf
    owner: root
    group: root
    mode: "0644"
  notify: Reload nginx
