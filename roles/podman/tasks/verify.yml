---
- name: Read the installed Podman version
  ansible.builtin.command:
    argv:
      - podman
      - --version
  register: podman_installed_version
  changed_when: false
  check_mode: false

- name: Assert the pinned Podman version is installed
  ansible.builtin.assert:
    that:
      - podman_installed_version.stdout is search('podman version ' ~ (podman_version | regex_escape) ~ '\.')
    fail_msg: >-
      Expected Podman {{ podman_version }}, found
      "{{ podman_installed_version.stdout }}".
    quiet: true

- name: Read the containers.conf drop-in
  ansible.builtin.slurp:
    src: /etc/containers/containers.conf.d/99-technitium.conf
  register: podman_containers_conf
  when: podman_manage_containers_conf | bool

- name: Assert the Aardvark DNS port is configured
  ansible.builtin.assert:
    that:
      - "('dns_bind_port = ' ~ podman_dns_bind_port) in (podman_containers_conf.content | b64decode)"
    fail_msg: The containers.conf drop-in is missing the Aardvark DNS port.
    quiet: true
  when: podman_manage_containers_conf | bool
