---
- name: Verify the supported platform
  ansible.builtin.assert:
    that:
      - ansible_distribution == "AlmaLinux"
      - ansible_distribution_major_version | int == 10
    fail_msg: Only AlmaLinux 10 is supported.
    quiet: true

- name: Validate the pinned Podman version
  ansible.builtin.assert:
    that:
      - podman_version is match('^[0-9]+(\.[0-9]+)?$')
    fail_msg: podman_version must be a major version such as "6" or "6.1".
    quiet: true

- name: Validate the Aardvark DNS port
  ansible.builtin.assert:
    that:
      - podman_dns_bind_port | int > 1024
      - podman_dns_bind_port | int != 53
    fail_msg: podman_dns_bind_port must be an unprivileged port other than 53.
    quiet: true
